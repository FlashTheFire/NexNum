# Production Docker Compose (Monorepo Root)
# For self-hosted, VPS, or Coolify deployments

name: nexnum

services:
  # ============================================
  # Main Web Application & API
  # ============================================
  nexnum-app:
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        DATABASE_URL: ${DATABASE_URL}
        DATABASE_URL_DIRECT: ${DATABASE_URL_DIRECT}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
    image: nexnum-app
    container_name: nexnum-app
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MEILISEARCH_HOST: http://meilisearch:7700
      SOCKET_HOST: nexnum-socket
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ============================================
  # Background Worker
  # ============================================
  nexnum-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: nexnum-worker
    container_name: nexnum-worker
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      NODE_ENV: production
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MEILISEARCH_HOST: http://meilisearch:7700
      TELEGRAM_BOT_TOKEN: ${BOT_TOKEN}
      ZOMBIE_ALERT_CHAT_ID: ${ADMIN_ID}
    env_file:
      - .env
    depends_on:
      nexnum-app:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "pgrep", "node" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ============================================
  # WebSocket Server
  # ============================================
  nexnum-socket:
    build:
      context: .
      dockerfile: Dockerfile.socket
    image: nexnum-socket
    container_name: nexnum-socket
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      NODE_ENV: production
      PORT: 3951
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MEILISEARCH_HOST: http://meilisearch:7700
    env_file:
      - .env
    ports:
      - "127.0.0.1:3951:3951"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3951/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ============================================
  # Redis (Production with RediSearch)
  # ============================================
  redis:
    image: redis/redis-stack-server:latest
    container_name: nexnum-redis
    environment:
      REDIS_ARGS: "--requirepass ${REDIS_PASSWORD:-4807afac74c98db34a06d9c50158a83b87746b4b2e47273e20495dbb92f85811} --save 900 1"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-4807afac74c98db34a06d9c50158a83b87746b4b2e47273e20495dbb92f85811}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-4807afac74c98db34a06d9c50158a83b87746b4b2e47273e20495dbb92f85811}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # RedisInsight (Local GUI)
  # ============================================
  redisinsight:
    image: redis/redisinsight:latest
    container_name: nexnum-redisinsight
    restart: unless-stopped
    ports:
      - "127.0.0.1:5540:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy

  # ============================================
  # MeiliSearch (Production)
  # ============================================
  meilisearch:
    image: getmeili/meilisearch:v1.12.0
    container_name: nexnum-meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: true
    volumes:
      - meili_data:/meili_data
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:7700:7700"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:7700/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # NexNum Telegram Bot
  # ============================================
  nexnum-bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    image: nexnum-bot
    container_name: nexnum-bot
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-4807afac74c98db34a06d9c50158a83b87746b4b2e47273e20495dbb92f85811}
      DATABASE_URL: ${DATABASE_URL}
      NEXNUM_API_URL: http://nexnum-app:3000
      ENABLE_PROVIDER_SYNC: ${ENABLE_PROVIDER_SYNC:-true}
      NEXNUM_API_KEY: ${NEXNUM_API_KEY}
      SUPPORT_AI_API_KEY: ${SUPPORT_AI_API_KEY}
      BOT_TOKEN: ${BOT_TOKEN:-${TELEGRAM_BOT_TOKEN}}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-${BOT_TOKEN}}
      ADMIN_ID: ${ADMIN_ID:-5716978793}
      CHANNEL_ID: ${CHANNEL_ID:-${TELEGRAM_ADMIN_CHANNEL}}
      TELEGRAM_ADMIN_CHANNEL: ${TELEGRAM_ADMIN_CHANNEL:-${CHANNEL_ID}}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-${NEXT_PUBLIC_APP_URL}}
      PAYMENT_GATEWAY_API_KEY: ${PAYMENT_GATEWAY_API_KEY:-dummy_gateway_key}
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      nexnum-app:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python3", "-c", "import sys, socket; s = socket.socket(); s.connect(('redis', 6379)); sys.exit(0)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

# ============================================
# Volumes
# ============================================
volumes:
  redis_data:
    driver: local
  redisinsight_data:
    driver: local
  meili_data:
    driver: local

# ============================================
# Networks
# ============================================
networks:
  default:
    name: nexnum-prod
