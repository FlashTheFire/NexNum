# Production Docker Compose (Monorepo Root)
# For self-hosted, VPS, or Coolify deployments

name: nexnum

services:
  # ============================================
  # Main Web Application & API
  # ============================================
  nexnum-app:
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        DATABASE_URL: ${DATABASE_URL}
        DATABASE_URL_DIRECT: ${DATABASE_URL_DIRECT}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
    image: nexnum-app
    container_name: nexnum-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MEILISEARCH_HOST: http://meilisearch:7700
      SOCKET_HOST: nexnum-socket
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ============================================
  # Background Worker
  # ============================================
  nexnum-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: nexnum-worker
    container_name: nexnum-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MEILISEARCH_HOST: http://meilisearch:7700
      TELEGRAM_BOT_TOKEN: ${BOT_TOKEN}
      ZOMBIE_ALERT_CHAT_ID: ${ADMIN_ID}
    env_file:
      - .env
    depends_on:
      nexnum-app:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "pgrep", "node" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ============================================
  # WebSocket Server
  # ============================================
  nexnum-socket:
    build:
      context: .
      dockerfile: Dockerfile.socket
    image: nexnum-socket
    container_name: nexnum-socket
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3951
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MEILISEARCH_HOST: http://meilisearch:7700
    env_file:
      - .env
    ports:
      - "127.0.0.1:3951:3951"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3951/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ============================================
  # Redis (Production)
  # ============================================
  redis:
    image: redis/redis-stack-server:latest
    container_name: nexnum-redis
    environment:
      REDIS_ARGS: "--requirepass ${REDIS_PASSWORD:-strongpassword} --save 60 1"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-strongpassword}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # MeiliSearch (Production)
  # ============================================
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: nexnum-meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:-masterkey}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: true
    volumes:
      - meili_data:/meili_data
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:7700:7700"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:7700/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # NexNum Telegram Bot
  # ============================================
  nexnum-bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    image: nexnum-bot
    container_name: nexnum-bot
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-strongpassword}
      DATABASE_URL: ${DATABASE_URL}
      NEXNUM_API_URL: http://nexnum-app:3000
      ENABLE_PROVIDER_SYNC: ${ENABLE_PROVIDER_SYNC:-true}
      NEXNUM_API_KEY: ${NEXNUM_API_KEY:-nxn_live_-YbCKi0hkPq1W4PQfn_GRAYUMYfdUYkr}
    env_file:
      - .env
    depends_on:
      nexnum-app:
        condition: service_healthy
      redis:
        condition: service_healthy

# ============================================
# Volumes
# ============================================
volumes:
  redis_data:
    driver: local
  meili_data:
    driver: local

# ============================================
# Networks
# ============================================
networks:
  default:
    name: nexnum-prod
